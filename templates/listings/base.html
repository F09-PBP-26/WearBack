{% extends 'base.html' %}
{% load static %}

{% block page_css %}<link rel="stylesheet" href="{% static 'css/listings.css' %}?v=1">{% endblock page_css %}
{% block content %}
<main class="listing-page">
  <nav class="listing-actions" aria-label="Listing navigation">
    <a href="{% url 'listings:index' %}">All listings</a>
    {% if request.user.is_authenticated %}
      <a href="{% url 'listings:mine' %}">My listings</a>
    {% endif %}
  </nav>
  {% block listing_content %}{% endblock listing_content %}
</main>
{% endblock content %}
