{% load static %}
<div class="seller-field{% if field.errors %} seller-field-invalid{% endif %}">
  {{ field.label_tag }}
  {% if select %}<div class="seller-select">{% endif %}
  {{ field }}
  {% if select %}<img src="{% static 'img/listing-chevron.svg' %}" width="18" height="18" alt="" aria-hidden="true"></div>{% endif %}
  {% if field.help_text %}<p class="seller-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
  {{ field.errors }}
</div>
