{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WearBack{% endblock title %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="page">
    <header class="navbar">
      <a class="nav-brand" href="{% url 'main:show_main' %}" aria-label="WearBack home"><span class="brand-wear">Wear</span><span class="brand-back">Back</span></a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="navbar-menu" aria-label="Toggle navigation menu">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>

      <nav class="nav-menu" id="navbar-menu" aria-label="Main navigation">
        <form class="search" role="search" onsubmit="return false">
          <label class="search-label" for="site-search" hidden>Search items</label>
          <input class="search-input" id="site-search" type="search" placeholder="Search 90s leather, jacket, batik, vintage denim...">
          <img class="search-icon" src="{% static 'img/search.svg' %}" alt="" width="12" height="12">
        </form>

        <div class="profile">
          <div class="profile-avatar">
            <img class="profile-image" src="{% static 'img/profile.png' %}" alt="Profile photo of CK Ben." width="32" height="32">
            <span class="profile-status" aria-hidden="true"></span>
          </div>
          <p class="profile-name">CK Ben.</p>
        </div>
      </nav>
    </header>

    {% block content %}{% endblock content %}

    <footer class="footer">
      <p class="footer-text">© 2026 WearBack. Kelompok F09 Kelas PBP F Gasal 2026/2027</p>
    </footer>
  </div>

  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
