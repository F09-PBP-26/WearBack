{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WearBack{% endblock title %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
  {% block page_css %}{% endblock page_css %}
</head>
<body class="auth-body">
  <header class="auth-navbar">
    <a class="auth-brand" href="{% url 'main:show_main' %}" aria-label="WearBack home">
      <span class="auth-brand-logo">
        <span class="auth-brand-ellipse-box auth-brand-ellipse-box-left"><img class="auth-brand-ellipse auth-brand-ellipse-left" src="{% static 'img/brand-ellipse-left.png' %}" alt="" width="51" height="51"></span>
        <span class="auth-brand-ellipse-box auth-brand-ellipse-box-right"><img class="auth-brand-ellipse auth-brand-ellipse-right" src="{% static 'img/brand-ellipse-right.png' %}" alt="" width="51" height="51"></span>
      </span>
      <span class="auth-brand-name"><span class="brand-wear">Wear</span><span class="brand-back">Back</span></span>
    </a>
    <form class="search" role="search" onsubmit="return false">
      <label for="site-search" hidden>Search items</label>
      <input class="search-input" id="site-search" type="search" placeholder="Search 90s leather, Stüssy, Acne Studios, vintage denim...">
      <img class="search-icon" src="{% static 'img/search.svg' %}" alt="" width="12" height="12">
    </form>
  </header>

  {% block content %}{% endblock content %}

  <footer class="footer">
    <p class="footer-text">© 2026 WearBack. Kelompok F09 Kelas PBP F Gasal 2026/2027</p>
  </footer>
</body>
</html>
